function alive(){return state.characters.filter(c=>c.alive);}
function locName(c){const k=kingdoms[c.kingdom];return c.location==='town'?k.town:c.location==='academy'?k.academy:c.location==='dungeon'?k.dungeon:'Perjalanan';}

if(sk&&c.mp>=sk.cost){c.mp-=sk.cost;c.skillUse++;
if(sk.type==='guard'||sk.type==='barrier'||sk.type==='evasion'||sk.type==='buff'){c.guard=sk.type==='guard'?2:0;c.evade=sk.type==='evasion'?2:0;c.buff=sk.type==='buff'?2:0;if(sk.type==='buff')gainStat(c,'ATK',1);lines.push(use);if(sk.type==='barrier')c.hp=Math.min(c.stats.HP,c.hp+12);dmg=sk.power?Math.max(1,Math.round(c.stats.ATK*sk.power-m.def*.4)):0;}
else{let raw=sk.type==='magic'?c.stats.MAG*sk.power:c.stats.ATK*sk.power;dmg=Math.max(1,Math.round(raw-(sk.type==='pierce'?m.def*.25:m.def*.65)));if(Math.random()*100<c.stats.CRIT)dmg=Math.round(dmg*c.stats['CRIT DMG']/100);if(sk.type==='poison')m.poison=3;if(sk.status&&Math.random()<.22)m[sk.status]=1;lines.push(use);}
}else{dmg=Math.max(1,Math.round(c.stats.ATK*(.8+Math.random()*.45)-m.def*.6));lines.push('Basic Attack');}
if(dmg>0)m.hp-=dmg;
if(m.hp<=0)break;
let mdmg=Math.max(1,Math.round(m.atk*.8-c.stats.DEF*.45));if(m.mag>c.stats.MDEF&&Math.random()<.25)mdmg=Math.max(1,Math.round(m.mag-c.stats.MDEF*.4));
if(c.evade>0){c.evade--;mdmg=0;}else if(Math.random()*100<c.stats.EVA)mdmg=0;
if(c.guard>0){mdmg=Math.round(mdmg*.35);c.guard--;}
if(m.poison>0){m.hp-=3;m.poison--;}
c.hp-=mdmg;
}
if(m.hp<=0){let reward=rand(8,25)+m.xp*2;c.gold+=reward;c.kills++;c.wins++;c.rep+=2;c.stamina=Math.max(0,c.stamina-rand(8,16));let skey=pick(c.class==='Mage'?['MAG','WIS']:c.class==='Warrior'?['ATK','END','DEF']:c.class==='Archer'?['ACC','SPD']:['SPD','CRIT']);gainStat(c,skey,1);if(Math.random()<.18){let item=pick(['Iron Ore','Monster Fang','Mana Crystal','Ancient Relic']);c.loot++;}log(c.name+' mengalahkan '+m.name+' setelah '+turns+' giliran, memperoleh '+reward+' gold dan kemajuan '+skey+'.','combat');maybeTitle(c,'Goblin Slayer',c.kills>=5);maybeTitle(c,'Dungeon Survivor',c.escapes>=3&&c.wins>=5);maybeTitle(c,'Dragon Hunter',c.kills>=8);if(c.kills%4===0){let key=pick(['ATK','DEF','MAG','SPD','ACC']);gainStat(c,key,1);}return;}
if(c.hp<=0){c.hp=0;c.alive=false;state.dead.push(c);log(c.name+' ('+c.class+') meninggal saat melawan '+m.name+'.','death');return;}
c.hp=Math.max(1,c.hp);c.injured=c.hp<start*.65;
}
function tick(){
if(state.paused)return;
state.minute+=10;if(state.minute>=1440){state.minute-=1440;state.day++;log('Hari '+state.day+' dimulai di empat kerajaan.','world');}
state.tick++;
alive().forEach(c=>{if(c.nextAction>state.tick)return;c.nextAction=state.tick+rand(1,3);decision(c);});
if(state.tick%12===0&&Math.random()<.3){let k=pick(kingdoms),e=pick(['Pasar '+k.name+' ramai oleh pedagang keliling.','Penjaga '+k.name+' melaporkan aktivitas monster.','Akademi '+k.name+' membuka sesi latihan tambahan.','Rumor artefak langka terdengar di '+k.name+'.']);log(e,'event');}
if(state.tick%24===0)save(false);
render();
}
const tabs=[['overview','Dunia'],['kingdoms','Kerajaan'],['characters','Karakter'],['dungeons','Dungeon'],['guilds','Guild'],['quests','Quest'],['bestiary','Bestiary'],['events','Kronik'],['memorial','Memorial'],['settings','Pengaturan']];
function metrics(){const a=alive();return '<div class="metric"><span>Populasi hidup</span><strong>'+a.length+'</strong></div><div class="metric"><span>Memorial</span><strong>'+state.dead.length+'</strong></div><div class="metric"><span>Monster dikalahkan</span><strong>'+a.reduce((n,c)=>n+c.kills,0)+state.dead.reduce((n,c)=>n+c.kills,0)+'</strong></div><div class="metric"><span>Guild aktif</span><strong>'+state.guilds.length+'</strong></div>';}
function charRow(c){return '<div class="item"><div class="info"><strong>'+esc(c.name)+'</strong><small>'+esc(c.race)+' · '+esc(c.class)+' · '+esc(kingdoms[c.kingdom].name)+'</small><div class="bar"><i style="width:'+Math.max(0,c.hp/c.stats.HP*100)+'%"></i></div><small>HP '+c.hp+'/'+c.stats.HP+' · '+esc(c.activity)+'</small></div><button onclick="window.openChar('+state.characters.indexOf(c)+')">Lihat</button></div>';}
function overview(){
const a=alive().slice().sort((x,y)=>y.kills-x.kills),recent=state.events.slice(0,12);
return '<div class="layout"><section class="panel"><h2>✦ Ringkasan Dunia</h2><div class="notice">Simulasi berjalan otomatis. Karakter memilih aktivitas sendiri; Tuan hanya mengamati dan mengatur waktu dunia.</div><div class="two"><div class="statbox"><span>Hari simulasi</span><b>'+state.day+'</b></div><div class="statbox"><span>Jam dunia</span><b>'+clock()+'</b></div><div class="statbox"><span>Petualang aktif</span><b>'+a.length+'</b></div><div class="statbox"><span>Quest selesai</span><b>'+a.reduce((n,c)=>n+c.quests,0)+'</b></div></div><h3>Petualang yang menonjol</h3><div class="list">'+(a.slice(0,7).map(charRow).join('')||'<div class="empty">Belum ada karakter.</div>')+'</div></section><section class="panel"><h2>📜 Kronik Terbaru</h2><div class="log">'+recent.map(e=>'<div class="logline"><time>H'+e.day+' '+e.time+'</time>'+esc(e.msg)+'</div>').join('')+'</div><h3>Kerajaan</h3>'+kingdoms.map((k,i)=>'<div class="item"><div class="info"><strong>'+esc(k.name)+'</strong><small>'+alive().filter(c=>c.kingdom===i).length+' petualang aktif</small></div><button onclick="window.goKingdom('+i+')">Buka</button></div>').join('')+'</section></div>';
}
function kingdomsView(){
return '<div class="layout"><section class="panel"><h2>Empat Kerajaan</h2>'+kingdoms.map((k,i)=>'<article class="kingdom"><h3>'+esc(k.name)+'</h3><p>'+esc(k.theme)+' — '+esc(k.desc)+'</p><div class="two"><div class="statbox"><span>Pusat kota</span><b>'+esc(k.town)+'</b></div><div class="statbox"><span>Akademi</span><b>'+esc(k.academy)+'</b></div><div class="statbox"><span>Dungeon khas</span><b>'+esc(k.dungeon)+'</b></div><div class="statbox"><span>Petualang di wilayah</span><b>'+alive().filter(c=>c.kingdom===i).length+'</b></div></div><h3>Monster yang diketahui</h3>'+k.monsters.map(m=>'<span class="tag">'+esc(m)+'</span>').join('')+'<p style="margin-top:9px"><button onclick="window.goKingdom('+i+')">Lihat penduduk & aktivitas</button></p></article>').join('')+'</section><section class="panel"><h2>Aktivitas lokasi</h2><div class="list">'+['town','academy','dungeon','travel'].map(loc=>'<div class="item"><div class="info"><strong>'+({town:'Pusat Kota',academy:'Akademi',dungeon:'Dungeon',travel:'Perjalanan'}[loc])+'</strong><small>'+alive().filter(c=>c.location===loc).length+' karakter</small></div><button onclick="window.filterLocation(&quot;'+loc+'&quot;)">Lihat</button></div>').join('')+'</div></section></div>';
}
function charactersView(){
let arr=alive().filter(c=>(!state.filter||(c.name+' '+c.race+' '+c.class+' '+c.personality).toLowerCase().includes(state.filter.toLowerCase()))&&(state.kingdomFilter==='all'||c.kingdom===+state.kingdomFilter));
return '<section class="panel"><h2>Karakter Dunia ('+arr.length+')</h2><div class="field"><input id="searchChar" placeholder="Cari nama, ras, class..." value="'+esc(state.filter)+'"><select id="filterKing"><option value="all">Semua kerajaan</option>'+kingdoms.map((k,i)=>'<option value="'+i+'" '+(state.kingdomFilter==i?'selected':'')+'>'+k.name+'</option>').join('')+'</select><select id="sortChar"><option value="power">Urut: Power</option><option value="kills">Monster dikalahkan</option><option value="gold">Kekayaan</option><option value="name">Nama</option></select></div><div class="list" id="charList">'+(arr.map(charRow).join('')||'<div class="empty">Tidak ada karakter yang cocok.</div>')+'</div></section>';
}
function dungeonsView(){
return '<div class="layout"><section class="panel"><h2>Dungeon & Raid</h2>'+kingdoms.map((k,i)=>'<article class="kingdom"><h3>'+esc(k.dungeon)+'</h3><p>'+esc(k.name)+' · Ancaman '+(['Rendah','Menengah','Tinggi','Sangat tinggi'][i])+'</p><div class="two"><div class="statbox"><span>Monster khas</span><b>'+k.monsters.map(esc).join(', ')+'</b></div><div class="statbox"><span>Petualang di dalam</span><b>'+alive().filter(c=>c.kingdom===i&&c.location==='dungeon').length+'</b></div></div><p style="margin-top:8px"><button onclick="window.showDungeon('+i+')">Pantau dungeon</button></p></article>').join('')+'</section><section class="panel"><h2>Eksplorasi aktif</h2><div class="list">'+alive().filter(c=>c.location==='dungeon').map(charRow).join('')+'</div></section></div>';
}
function guildsView(){return '<div class="layout"><section class="panel"><h2>Guild Aktif</h2>'+(state.guilds.length?state.guilds.map(g=>'<article class="kingdom"><h3>⚔ '+esc(g.name)+'</h3><p>'+g.members.length+' anggota · Reputasi '+g.rep+'</p>'+g.members.map(esc).map(n=>'<span class="tag">'+n+'</span>').join('')+'</article>').join(''):'<div class="empty">Belum ada guild. Karakter dapat mendirikan guild melalui keputusan AI.</div>')+'</section><section class="panel"><h2>Petualang tanpa guild</h2><div class="list">'+alive().filter(c=>!c.guild).slice(0,20).map(charRow).join('')+'</div></section></div>';}
function questsView(){const a=alive();return '<div class="layout"><section class="panel"><h2>Quest Board</h2><div class="notice">Quest dibuat dari aktivitas simulasi. Karakter dapat menerima tugas berburu, eksplorasi, dan pengumpulan material secara mandiri.</div>'+['Hunt Request','Dungeon Survey','Material Gathering','Academy Trial'].map((q,i)=>'<article class="kingdom"><h3>'+q+'</h3><p>'+['Kalahkan monster di wilayah kerajaan.','Jelajahi dungeon khas kerajaan.','Kumpulkan bahan dari monster.','Tingkatkan kemahiran di akademi.'][i]+'</p><span class="tag gold">Reward '+(20+i*15)+' gold</span><span class="tag">'+(i===1?'Berisiko': 'Aktivitas umum')+'</span></article>').join('')+'</section><section class="panel"><h2>Rekam aktivitas</h2><div class="statgrid"><div class="statbox"><span>Monster dikalahkan</span><b>'+a.reduce((n,c)=>n+c.kills,0)+'</b></div><div class="statbox"><span>Latihan</span><b>'+a.reduce((n,c)=>n+c.training,0)+'</b></div><div class="statbox"><span>Loot</span><b>'+a.reduce((n,c)=>n+c.loot,0)+'</b></div></div><h3>Petualang paling aktif</h3><div class="list">'+a.slice().sort((x,y)=>(y.kills+y.training)-(x.kills+x.training)).slice(0,8).map(charRow).join('')+'</div></section></div>';}
function bestiaryView(){let all={};kingdoms.forEach(k=>k.monsters.forEach(m=>all[m]=(all[m]||0)+1));return '<section class="panel"><h2>Bestiary</h2><div class="two">'+Object.keys(all).map(n=>{let m=monster(n,2);return '<article class="kingdom"><h3>◈ '+esc(n)+'</h3><p>Habitat: '+kingdoms.filter(k=>k.monsters.includes(n)).map(k=>k.name).join(', ')+'</p><div class="statgrid"><div class="statbox"><span>HP</span><b>'+m.hp+'</b></div><div class="statbox"><span>ATK</span><b>'+m.atk+'</b></div><div class="statbox"><span>DEF</span><b>'+m.def+'</b></div></div></article>';}).join('')+'</div></section>';}
function eventsView(){return '<section class="panel"><h2>Kronik Dunia</h2><div class="log" style="height:auto;max-height:65vh">'+state.events.map(e=>'<div class="logline"><time>Hari '+e.day+' · '+e.time+'</time>'+esc(e.msg)+'</div>').join('')+'</div></section>';}
function memorialView(){return '<section class="panel"><h2>Memorial</h2><p class="muted">Karakter yang meninggal tetap tercatat di sini dan tidak kembali ke simulasi normal.</p><div class="list">'+(state.dead.map(c=>'<div class="item"><div class="info"><strong>'+esc(c.name)+' <span class="tag red">Meninggal</span></strong><small>'+esc(c.race)+' · '+esc(c.class)+' · '+esc(kingdoms[c.kingdom].name)+' · '+c.kills+' monster dikalahkan</small></div><button onclick="window.openDead('+state.characters.indexOf(c)+')">Memorial</button></div>').join('')||'<div class="empty">Belum ada karakter yang meninggal.</div>')+'</div></section>';}
function settingsView(){return '<div class="layout"><section class="panel"><h2>Pengaturan Dunia</h2><div class="notice">Save disimpan di browser perangkat ini. Mode private atau penghapusan data browser dapat menghapus save.</div><div class="list"><div class="item"><div class="info"><strong>Simpan sekarang</strong><small>Simpan kondisi simulasi saat ini.</small></div><button onclick="window.save(true)">Simpan</button></div><div class="item"><div class="info"><strong>Export save JSON</strong><small>Unduh cadangan dunia.</small></div><button onclick="window.exportSave()">Export</button></div><div class="item"><div class="info"><strong>Import save JSON</strong><small>Muat dunia dari file cadangan.</small></div><input type="file" id="importFile" accept=".json,application/json" style="max-width:145px"></div><div class="item"><div class="info"><strong>Reset dunia</strong><small>Membuat 30 karakter baru. Save lama akan diganti setelah konfirmasi.</small></div><button class="danger" onclick="window.resetWorld()">Reset</button></div></div></section><section class="panel"><h2>Info Simulasi</h2><div class="statgrid"><div class="statbox"><span>Tick</span><b>'+state.tick+'</b></div><div class="statbox"><span>Kecepatan</span><b>'+state.speed+'×</b></div><div class="statbox"><span>Karakter awal</span><b>'+state.characters.length+'</b></div><div class="statbox"><span>Event tersimpan</span><b>'+state.events.length+'</b></div><div class="statbox"><span>Skill terdaftar</span><b>'+Object.keys(skillData).length+'</b></div><div class="statbox"><span>Ras</span><b>'+races.length+'</b></div></div><h3>Aturan</h3><p class="muted">Tidak ada level karakter. Atribut tumbuh melalui latihan dan pertarungan. Tidak ada romance atau sistem hubungan personal. Guild dan party hanya untuk mekanik gameplay.</p></section></div>';}
function render(){
$('#day').textContent=state.day;$('#clock').textContent=clock();$('#pauseBtn').textContent=state.paused?'▶ Lanjut':'Ⅱ Pause';document.querySelectorAll('.speed').forEach(b=>b.classList.toggle('active',+b.dataset.speed===state.speed));
$('#metrics').innerHTML=metrics();$('#tabs').innerHTML=tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(state.tab===t[0]?'active':'')+'">'+t[1]+'</button>').join('');
const map={overview:overview,kingdoms:kingdomsView,characters:charactersView,dungeons:dungeonsView,guilds:guildsView,quests:questsView,bestiary:bestiaryView,events:eventsView,memorial:memorialView,settings:settingsView};
$('#view').innerHTML=map[state.tab]();
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
if($('#searchChar'))$('#searchChar').oninput=e=>{state.filter=e.target.value;let pos=e.target.selectionStart;render();$('#searchChar').focus();$('#searchChar').setSelectionRange(pos,pos);};
if($('#filterKing'))$('#filterKing').onchange=e=>{state.kingdomFilter=e.target.value;render();};
if($('#sortChar'))$('#sortChar').onchange=e=>{let arr=alive().slice();const key=e.target.value;arr.sort((a,b)=>key==='name'?a.name.localeCompare(b.name):key==='gold'?b.gold-a.gold:key==='kills'?b.kills-a.kills:statPower(b)-statPower(a));$('#charList').innerHTML=arr.filter(c=>(!state.filter||(c.name+' '+c.race+' '+c.class+' '+c.personality).toLowerCase().includes(state.filter.toLowerCase()))&&(state.kingdomFilter==='all'||c.kingdom===+state.kingdomFilter)).map(charRow).join('');};
if($('#importFile'))$('#importFile').onchange=importSave;
}
window.openChar=i=>{const c=state.characters[i];if(!c)return;$('#modalTitle').textContent=c.name;$('#modalBody').innerHTML='<div class="two"><div class="statbox"><span>Ras / Class</span><b>'+esc(c.race)+' / '+esc(c.class)+'</b></div><div class="statbox"><span>Gender / Umur</span><b>'+esc(c.gender)+' / '+c.age+'</b></div><div class="statbox"><span>Kerajaan</span><b>'+esc(kingdoms[c.kingdom].name)+'</b></div><div class="statbox"><span>Kepribadian</span><b>'+esc(c.personality)+'</b></div></div><h3>Status & tujuan</h3><p>'+esc(c.activity)+'<br><span class="muted">Lokasi: '+esc(locName(c))+' · Target: '+esc(c.goal)+'</span></p><div class="statgrid">'+Object.keys(c.stats).map(k=>'<div class="statbox"><span>'+esc(k)+'</span><b>'+c.stats[k]+'</b></div>').join('')+'</div><h3>Kondisi</h3><p>HP '+c.hp+'/'+c.stats.HP+' · MP '+c.mp+'/'+c.stats.MP+' · Stamina '+c.stamina+'/100 · Gold '+c.gold+'</p><div class="bar"><i style="width:'+c.hp/c.stats.HP*100+'%"></i></div><h3>Skill</h3>'+c.skills.map(s=>'<div class="item"><div class="info"><strong>'+esc(s)+'</strong><small>'+esc(skillData[s]?.desc||'Skill class')+' · Biaya '+(skillData[s]?.cost||0)+' MP</small></div></div>').join('')+'<h3>Ras & Class</h3><p>'+esc(c.trait)+' — '+esc(c.weak)+'</p><p>Title: '+(c.titles.length?c.titles.map(esc).join(', '):'Belum memiliki title')+'</p><h3>Riwayat terakhir</h3>'+c.history.map(h=>'<div class="logline">Hari '+h.day+' — '+esc(h.act)+'</div>').join('');$('#modalback').classList.add('show');};
window.openDead=i=>{const c=state.characters[i];if(!c)return;window.openChar(i);$('#modalTitle').textContent='Memorial — '+c.name;};
window.goKingdom=i=>{state.kingdomFilter=String(i);state.filter='';state.tab='characters';render();};
window.filterLocation=loc=>{state.filter='';state.tab='characters';render();$('#searchChar').value='';let arr=alive().filter(c=>c.location===loc);$('#charList').innerHTML=arr.map(charRow).join('')||'<div class="empty">Tidak ada karakter di lokasi ini.</div>';};
window.showDungeon=i=>{state.tab='dungeons';render();let arr=alive().filter(c=>c.kingdom===i&&c.location==='dungeon');$('#modalTitle').textContent=kingdoms[i].dungeon;$('#modalBody').innerHTML='<p>'+esc(kingdoms[i].desc)+'</p><h3>Petualang di dalam dungeon</h3><div class="list">'+arr.map(c=>'<div class="item"><div class="info"><strong>'+esc(c.name)+'</strong><small>HP '+c.hp+'/'+c.stats.HP+' · '+esc(c.activity)+'</small></div><button onclick="window.openChar('+state.characters.indexOf(c)+')">Lihat</button></div>').join('')+'</div><h3>Monster yang mungkin muncul</h3>'+kingdoms[i].monsters.map(m=>'<span class="tag">'+esc(m)+'</span>').join('');$('#modalback').classList.add('show');};
window.save=(notify)=>{try{localStorage.setItem('hahaWorldSave',JSON.stringify(state));if(notify)alert('Dunia berhasil disimpan di browser.');}catch(e){if(notify)alert('Gagal menyimpan: '+e.message);}};
window.exportSave=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='haha-world-save.json';a.click();URL.revokeObjectURL(url);};
function importSave(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.characters)||!Array.isArray(d.events)||!Number.isFinite(d.day))throw new Error('Format save tidak cocok');if(!confirm('Ganti dunia saat ini dengan save yang diimpor?'))return;Object.assign(state,d);render();window.save(true);}catch(err){alert('Import gagal: '+err.message);}};reader.readAsText(f);}
window.resetWorld=()=>{if(!confirm('Reset seluruh dunia dan mengganti save saat ini?'))return;freshWorld();window.save(false);state.tab='overview';render();};
$('#closeModal').onclick=()=>$('#modalback').classList.remove('show');$('#modalback').onclick=e=>{if(e.target===$('#modalback'))$('#modalback').classList.remove('show');};
$('#pauseBtn').onclick=()=>{state.paused=!state.paused;render();};document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>{state.speed=+b.dataset.speed;render();});
function load(){try{const raw=localStorage.getItem('hahaWorldSave');if(raw){const d=JSON.parse(raw);if(Array.isArray(d.characters)&&Array.isArray(d.events)){Object.assign(state,d);state.paused=true;return;}}}catch(e){}freshWorld();}
load();render();setInterval(()=>{if(!state.paused){for(let i=0;i<state.speed;i++)tick();}},1200);
})();
</script>
